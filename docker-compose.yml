version: "3.9"

services:
  scribeflow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scribeflow-ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - app-data:/app/data
      - vector-db:/app/vector_db
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  app-data:
  vector-db:
